/* Layout: one centered night-sky playfield, control row and a short footer beneath it. Single committed dark look. */
:root {
  --night: #0b1622;
  --card: #14293a;
  --glow: #f4d35e;
  --mist: #9fb8c2;

  --danger: #ff6b6b;
  --panel: rgba(9, 16, 26, 0.86);
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.stage {
  position: relative;
  width: 100%;
  max-width: 420px;
  aspect-ratio: 9 / 14;
  max-height: calc(100vh - 120px);
  min-height: 300px;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(159, 184, 194, 0.14);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
canvas { display: block; width: 100%; height: 100%; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px; background: rgba(6, 10, 18, 0.5); }
.overlay[hidden] { display: none; }
.title { font-family: var(--font-display); font-weight: 700; font-size: 2.1rem; background: linear-gradient(90deg, #f4d35e, #ff9f43, #f4d35e); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 12px rgba(0,0,0,.6)); animation: shine 5s linear infinite; }
@keyframes shine { to { background-position: -200% 0; } }
.panel.wide { width: min(100%, 320px); }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; width: 100%; font-size: 0.74rem; text-align: left; color: var(--mist); margin-bottom: 4px; }
.statgrid b { display: block; font-size: 1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.statgrid .span2 { grid-column: 1 / -1; }
.achlist { width: 100%; max-height: 118px; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; text-align: left; font-size: 0.8rem; margin-bottom: 8px; touch-action: pan-y; overscroll-behavior: contain; }
.achi { display: flex; gap: 8px; align-items: flex-start; opacity: 0.45; }
.achi.on { opacity: 1; }
.achi i { font-style: normal; width: 18px; flex: none; text-align: center; color: var(--glow); }
.achi small { display: block; color: var(--mist); font-size: 0.72rem; }
.rankbox { display: flex; flex-direction: column; align-items: center; gap: 5px; margin-top: 2px; width: 100%; }
.xpbar { width: min(100%, 250px); height: 6px; border-radius: 3px; background: rgba(255,255,255,0.14); overflow: hidden; }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #f4d35e, #ff9f43); transition: width 0.6s; }
#prof { background: rgba(6, 10, 18, 0.92); padding: 10px; }
#prof .panel { max-height: 100%; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; padding: 16px 16px 12px; }
#pClose { position: sticky; bottom: 0; flex: none; }
#prof .achlist { max-height: none; overflow: visible; }
.mrow { display: flex; gap: 10px; width: 100%; max-width: 290px; margin-top: 6px; }
.mrow button { flex: 1; }
.hint { max-width: 290px; color: var(--ink); line-height: 1.4; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
.legend { display: flex; flex-direction: column; gap: 7px; margin-top: 6px; font-size: 0.82rem; color: var(--mist); text-align: left; max-width: 290px; }
.lg { display: flex; align-items: center; gap: 10px; }
.lgi { flex: none; width: 26px; text-align: center; font-weight: 700; color: var(--ink); display: inline-flex; justify-content: center; }
.pick { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; width: 100%; }
.pick .plabel { font-size: 0.8rem; color: var(--mist); }
.lvgrid { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; max-width: 290px; max-height: 128px; overflow-y: auto; padding: 2px; overscroll-behavior: contain; touch-action: pan-y; }
.lvb { min-width: 0 !important; padding: 5px 0 !important; min-height: 40px; font-size: 0.85rem; line-height: 1.15; font-weight: 600; }
.lvb small { display: block; font-size: 0.62rem; opacity: 0.85; letter-spacing: 1px; }
.lvb.sel { background: var(--glow); color: #2a2200; }
.pick[hidden] { display: none; }
.go { font-family: var(--font-display); font-weight: 600; margin-top: 12px; color: var(--glow); animation: pulse 1.6s ease-in-out infinite; }
.panel { background: var(--panel); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 20px; padding: 22px 22px 20px; width: min(100%, 300px); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.label { color: var(--mist); font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 3.2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.best { color: var(--glow); font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.meta { color: var(--mist); font-size: 0.85rem; margin-bottom: 10px; }

button { font: inherit; color: var(--ink); cursor: pointer; border: 0; border-radius: 14px; padding: 12px 14px; background: rgba(159, 184, 194, 0.16); min-height: 44px; }
button:hover { background: rgba(159, 184, 194, 0.26); }

.primary { flex: 1; background: var(--glow); color: #2a2200; font-weight: 600; box-shadow: 0 4px 0 #b99a2c; }
.primary:hover { background: #f9dc74; }
.secondary { flex: 1; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.controls button { min-width: 84px; padding: 12px 10px; flex: 1 1 0; max-width: 140px; }
.toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--panel); padding: 8px 14px; border-radius: 999px; font-size: 0.85rem; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
.toast.show { opacity: 1; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { .go { animation: none; } }
